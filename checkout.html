<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Checkout & Pemesanan - Toko Buku Pustaka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="checkout-container">
    <h2>Form Pemesanan & Laporan Buku</h2>
    <p><a href="dashboard.html" class="link-kembali">&larr; Kembali ke Dashboard</a></p>
    
    <form id="form-checkout" style="margin-top: 15px;">
      <div class="form-group" style="margin-bottom: 12px;">
        <label>Nama Pemesan:</label>
        <input type="text" id="nama-pemesan" placeholder="Masukkan nama lengkap" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
      </div>

      <div class="form-group" style="margin-bottom: 12px;">
        <label>Alamat Pengiriman:</label>
        <textarea id="alamat-pengiriman" placeholder="Masukkan alamat lengkap" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;"></textarea>
      </div>
      
      <div class="form-group" style="margin-bottom: 12px;">
        <label>Pilih Buku:</label>
        <select id="checkout-buku" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
          <option value="Pemrograman Web">Pemrograman Web (Rp 75.000)</option>
          <option value="Algoritma & Pemrograman">Algoritma & Pemrograman (Rp 85.000)</option>
          <option value="Basis Data Dasar">Basis Data Dasar (Rp 65.000)</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom: 12px;">
        <label>Jumlah Beli:</label>
        <input type="number" id="checkout-jumlah" min="1" value="1" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label>Metode Pembayaran:</label>
        <select id="metode-pembayaran" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
          <option value="Transfer Bank">Transfer Bank</option>
          <option value="GoPay">GoPay / QRIS</option>
          <option value="COD">Bayar di Tempat (COD)</option>
        </select>
      </div>
      
      <button type="submit" class="btn-submit">Proses Pesanan</button>
    </form>

    <div id="hasil-checkout" style="margin-top: 20px; padding: 10px; background: #f9f9f9; border-radius: 4px; display: none;">
      <!-- Ringkasan transaksi / laporan akan muncul di sini -->
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
